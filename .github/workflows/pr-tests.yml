name: Pull Request Tests

on:
  pull_request:
    branches: [ master ]

jobs:
  required-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
    
    - name: Run core tests
      run: |
        # Run only the core unit tests that must pass
        python -m pytest tests/unit/ -v --tb=short
        echo "✅ All core tests passed!"
    
    - name: Verify test coverage
      run: |
        python -m pytest tests/unit/ --cov=sambuca.core --cov-fail-under=70
        echo "✅ Test coverage meets minimum requirements!"

  lint-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Check for critical errors
      run: |
        # Only check for syntax errors and undefined names (required for merge)
        flake8 sambuca/ --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "✅ No critical linting errors found!"