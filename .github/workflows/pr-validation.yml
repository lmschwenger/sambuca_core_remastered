name: PR Validation

# This workflow runs on all pull requests and must pass before merging
on:
  pull_request:
    branches: [ master, dev ]

# Cancel previous runs if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]  # Install with dev dependencies including pytest
    
    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v --tb=short --durations=5
        echo "✅ Unit tests passed!"
    
    - name: Check test coverage
      run: |
        python -m pytest tests/unit/ --cov=sambuca --cov-report=term-missing --cov-fail-under=60
        echo "✅ Test coverage meets minimum requirements!"

  syntax-check:
    name: Code Syntax Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Check for syntax errors
      run: |
        # Check for Python syntax errors and undefined names
        flake8 sambuca/ --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "✅ No syntax errors found!"
    
    - name: Check for basic style issues
      run: |
        # Check for basic style issues (non-blocking)
        flake8 sambuca/ --count --max-line-length=100 --statistics || true
        echo "ℹ️  Style check completed (warnings above are informational)"

  package-install:
    name: Package Installation Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
    
    - name: Test package installation
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        echo "✅ Package installs successfully!"
    
    - name: Test basic imports
      run: |
        python -c "import sambuca; print('✅ Core package imports successfully')"
        python -c "import sambuca.core; print('✅ Core module imports successfully')"

  # Summary job that depends on all checks
  pr-validation-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, syntax-check, package-install]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        if [[ "${{ needs.unit-tests.result }}" == "success" && 
              "${{ needs.syntax-check.result }}" == "success" && 
              "${{ needs.package-install.result }}" == "success" ]]; then
          echo "🎉 All PR validation checks passed!"
          echo "✅ Unit tests: ${{ needs.unit-tests.result }}"
          echo "✅ Syntax check: ${{ needs.syntax-check.result }}"
          echo "✅ Package install: ${{ needs.package-install.result }}"
          echo ""
          echo "This PR is ready for review and merge! 🚀"
        else
          echo "❌ Some PR validation checks failed:"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Syntax check: ${{ needs.syntax-check.result }}"
          echo "Package install: ${{ needs.package-install.result }}"
          echo ""
          echo "Please fix the failing checks before merging."
          exit 1
        fi
