name: Comprehensive CI

# Full CI pipeline for main development branches
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

# Cancel previous runs if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprehensive-tests:
    name: Full Test Suite (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          # Reduce matrix size - test all Python versions on Ubuntu, fewer on others
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev xvfb
    
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install gdal
    
    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Windows GDAL installation via conda
        conda install -c conda-forge gdal
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,complete]
    
    - name: Run unit tests with coverage
      run: |
        python -m pytest tests/unit/ -v --cov=sambuca --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: Run integration tests
      run: |
        python -m pytest tests/integration/ -v --tb=short
      continue-on-error: true  # Integration tests might need external data
    
    - name: Run GUI tests (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        xvfb-run -a python -m pytest tests/gui/ -v --tb=short
      env:
        DISPLAY: ":99.0"
      continue-on-error: true  # GUI tests are often flaky in CI
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install black isort mypy pylint
    
    - name: Code formatting check (Black)
      run: |
        black --check --diff sambuca/ tests/ || {
          echo "❌ Code formatting issues found. Run 'black sambuca/ tests/' to fix."
          exit 1
        }
    
    - name: Import sorting check (isort)
      run: |
        isort --check-only --diff sambuca/ tests/ || {
          echo "❌ Import sorting issues found. Run 'isort sambuca/ tests/' to fix."
          exit 1
        }
    
    - name: Linting (flake8)
      run: |
        flake8 sambuca/ tests/ --max-line-length=100 --extend-ignore=E203,W503
    
    - name: Type checking (mypy)
      run: |
        mypy sambuca/ --ignore-missing-imports --follow-imports=skip
      continue-on-error: true  # Type checking is informational for now
    
    - name: Security check (bandit)
      run: |
        pip install bandit
        bandit -r sambuca/ -f json -o bandit-report.json || true
        if [ -f bandit-report.json ]; then
          echo "Security scan completed. Check bandit-report.json for details."
        fi
      continue-on-error: true

  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install sphinx sphinx-rtd-theme
    
    - name: Build documentation
      run: |
        if [ -d "docs" ]; then
          cd docs
          make html || {
            echo "❌ Documentation build failed"
            exit 1
          }
          echo "✅ Documentation built successfully"
        else
          echo "ℹ️  No docs directory found, skipping documentation build"
        fi
      continue-on-error: true

  package-build:
    name: Package Build and Upload Test
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, code-quality]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
        echo "✅ Package built successfully"
    
    - name: Check package
      run: |
        twine check dist/*
        echo "✅ Package structure is valid"
    
    - name: Test package installation
      run: |
        pip install dist/*.whl
        python -c "import sambuca; print('✅ Built package imports successfully')"

  performance-tests:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
        python -m pip install --upgrade pip
        pip install -e .[dev,complete]
        pip install pytest-benchmark
    
    - name: Run performance tests
      run: |
        if [ -f "tests/integration/test_performance_integration.py" ]; then
          python -m pytest tests/integration/test_performance_integration.py -v --benchmark-only
          echo "✅ Performance benchmarks completed"
        else
          echo "ℹ️  No performance tests found"
        fi
      continue-on-error: true

  # Summary job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, code-quality, documentation, package-build]
    if: always()
    
    steps:
    - name: Generate summary
      run: |
        echo "## 🔍 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.comprehensive-tests.result }}" == "success" ]]; then
          echo "✅ **Comprehensive Tests**: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Comprehensive Tests**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.code-quality.result }}" == "success" ]]; then
          echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.documentation.result }}" == "success" || "${{ needs.documentation.result }}" == "skipped" ]]; then
          echo "✅ **Documentation**: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Documentation**: Issues found" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.package-build.result }}" == "success" || "${{ needs.package-build.result }}" == "skipped" ]]; then
          echo "✅ **Package Build**: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Package Build**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
